<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ĐAN Restoran — Kontakti</title>
    <link rel="stylesheet" href="contacts.css">
</head>
<body>

    <!-- Video background — same as main page -->
    <div class="dance-background">
        <video autoplay muted loop playsinline>
            <source src="Open.mp4" type="video/mp4">
        </video>
        <div class="dance-overlay"></div>
    </div>

    <div class="page">

        <header class="header">
            <a href="index.html">
                <img src="Logo white.svg" alt="ĐAN Restoran" class="logo">
            </a>
            <p class="tagline">Prizrenska 15, Stari Grad, Beograd</p>
        </header>

        <main class="grid">

            <!-- Telefon -->
            <a href="tel:+38163446454" class="card">
                <div class="card-icon icon-phone">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white" width="40" height="40">
                        <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
                    </svg>
                </div>
                <span class="card-label">Pozovi nas</span>
                <span class="card-sub">+381 63 44 64 54</span>
            </a>

            <!-- WhatsApp -->
            <a href="https://wa.me/38163446454" class="card" target="_blank" rel="noopener noreferrer">
                <div class="card-icon">
                    <img src="WhatsApp.svg" alt="WhatsApp">
                </div>
                <span class="card-label">WhatsApp</span>
            </a>

            <!-- Telegram -->
            <a href="https://t.me/DAN_restoran" class="card" target="_blank" rel="noopener noreferrer">
                <div class="card-icon">
                    <img src="Telegram_logo.svg" alt="Telegram">
                </div>
                <span class="card-label">Telegram</span>
            </a>

            <!-- Instagram -->
            <a href="https://www.instagram.com/jan_belgrade" class="card" target="_blank" rel="noopener noreferrer">
                <div class="card-icon">
                    <img src="Instagram_logo_2022.svg" alt="Instagram">
                </div>
                <span class="card-label">Instagram</span>
            </a>

            <!-- Glovo -->
            <a href="https://glovoapp.com/sr/rs/belgrade/stores/djan-restoran-beg" class="card" target="_blank" rel="noopener noreferrer">
                <div class="card-icon">
                    <img src="glovo.svg" alt="Glovo">
                </div>
                <span class="card-label">Glovo</span>
                <span class="card-sub">Dostava</span>
            </a>

            <!-- Wolt -->
            <a href="https://wolt.com/sr/srb/belgrade/restaurant/djan" class="card" target="_blank" rel="noopener noreferrer">
                <div class="card-icon">
                    <img src="wolt.svg" alt="Wolt">
                </div>
                <span class="card-label">Wolt</span>
                <span class="card-sub">Dostava</span>
            </a>

            <!-- Google Maps -->
            <a href="https://www.google.com/maps/search/Prizrenska+15,+Stari+Grad,+Beograd" class="card wide" target="_blank" rel="noopener noreferrer">
                <div class="card-icon icon-maps">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white" width="40" height="40">
                        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
                    </svg>
                </div>
                <div class="card-text">
                    <span class="card-label">Google Maps</span>
                    <span class="card-sub">Prizrenska 15, Stari Grad, Beograd</span>
                </div>
            </a>

        </main>
    </div>

</body>
</html>
