<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ĐAN Restoran - Beograd</title>
    <link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
    <div class="dance-background">
        <video autoplay muted loop playsinline>
            <source src="dance_armenian.mp4" type="video/mp4">
        </video>
        <div class="dance-overlay"></div>
    </div>

    <div class="container">
        <!-- Логотип -->
        <header class="logo-container">
            <img src="Logo white.svg" alt="ĐAN Restoran Logo" class="logo">
        </header>

        <!-- Главный текст "Скоро открытие" -->
        <main class="main-content">
            <h1 class="opening-soon">
                <span class="opening-line1">Otvaranje</span>
                <span class="opening-line2">1. Februara</span>
            </h1>
        </main>

        <!-- Секция доставки -->
        <section class="delivery-section">
            <div class="delivery-links">
                <a href="#" class="delivery-link glass-button" id="wolt-link" target="_blank" rel="noopener noreferrer">
                    <img src="wolt.svg" alt="Wolt" class="delivery-logo">
                </a>
                <a href="#" class="delivery-link glass-button" id="glovo-link" target="_blank" rel="noopener noreferrer">
                    <img src="glovo.svg" alt="Glovo" class="delivery-logo">
                </a>
            </div>
        </section>

        <!-- Контакты -->
        <footer class="contact-section">
            <div class="contact-info">
                <p class="address">ĐAN Restoran</p>
                <p class="address">Prizrenska 15, Stari Grad, Beograd</p>
                <p class="phone">Phone: <a href="tel:+381634464​54">+381 63 44 64 54</a></p>
                <p class="telegram">Tg: <a href="https://t.me/DAN_resroran" target="_blank" rel="noopener noreferrer">@DAN_resroran</a></p>
            </div>
        </footer>
    </div>

    <!-- Popup -->
    <div id="delivery-popup" class="popup-overlay">
        <div class="popup-content">
            <button class="popup-close">&times;</button>
            <h2 class="popup-text">Uskoro</h2>
        </div>
    </div>

    <script>
        // Получаем элементы
        const popup = document.getElementById('delivery-popup');
        const woltLink = document.getElementById('wolt-link');
        const glovoLink = document.getElementById('glovo-link');
        const closeBtn = document.querySelector('.popup-close');

        // Показать popup при клике на Wolt
        woltLink.addEventListener('click', function(e) {
            e.preventDefault();
            popup.classList.add('active');
        });

        // Показать popup при клике на Glovo
        glovoLink.addEventListener('click', function(e) {
            e.preventDefault();
            popup.classList.add('active');
        });

        // Закрыть popup при клике на кнопку закрытия
        closeBtn.addEventListener('click', function() {
            popup.classList.remove('active');
        });

        // Закрыть popup при клике вне контента
        popup.addEventListener('click', function(e) {
            if (e.target === popup) {
                popup.classList.remove('active');
            }
        });
    </script>
</body>
</html>
