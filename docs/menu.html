      { cat: 'Соусы',  ru: 'Гранатовый соус Наршараб',     sr: 'Naršarab',                     en: 'Narsharab Pomegranate Sauce',          price:  200 },
      // Шаурма
      { cat: 'Шаурма', ru: 'Шаурма с курицей',             sr: 'Šaurma sa piletinom',          en: 'Chicken Shawarma',                     price:  800 },
      { cat: 'Шаурма', ru: 'Шаурма со свининой',           sr: 'Šaurma sa svinjetinom',        en: 'Pork Shawarma',                        price:  800 },
      // Бртуч
      { cat: 'Бртуч',  ru: 'Бртуч с курицей',              sr: 'Brtuč piletina',               en: 'Brtuch with Chicken',                  price:  700 },
      { cat: 'Бртуч',  ru: 'Бртуч со свининой',            sr: 'Brtuč svinjetina',             en: 'Brtuch with Pork',                     price:  700 },
    ];

    const CATS = [...new Set(MENU.map(i => i.cat))];

    let currentLang = 'ru';
    let currentCat  = 'all';

    function itemName(item, lang) {
      return item[lang] || item.ru;
    }

    function catLabel(cat, lang) {
      return LANGS[lang]?.categories[cat] || cat;
    }

    function renderCategories() {
      const el = document.getElementById('categories');
      const lang = LANGS[currentLang];
      el.innerHTML = '';

      const all = document.createElement('button');
      all.className = 'cat-pill' + (currentCat === 'all' ? ' active' : '');
      all.textContent = lang.all;
      all.addEventListener('click', () => { currentCat = 'all'; renderAll(); });
      el.appendChild(all);

      CATS.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = 'cat-pill' + (currentCat === cat ? ' active' : '');
        btn.textContent = catLabel(cat, currentLang);
        btn.addEventListener('click', () => { currentCat = cat; renderAll(); });
        el.appendChild(btn);
      });
    }

    function renderMenu() {
      const grid = document.getElementById('menu-grid');
      grid.innerHTML = '';

      const catsToShow = currentCat === 'all' ? CATS : [currentCat];

      catsToShow.forEach(cat => {
        const items = MENU.filter(i => i.cat === cat);
        if (!items.length) return;

        const group = document.createElement('div');
        group.className = 'section-group';

        const title = document.createElement('h2');
        title.className = 'section-title';
        title.textContent = catLabel(cat, currentLang);
        group.appendChild(title);

        const itemsGrid = document.createElement('div');
        itemsGrid.className = 'items-grid';

        items.forEach(item => {
          const card = document.createElement('div');
          card.className = 'item-card';

          const name = document.createElement('span');
          name.className = 'item-name';
          name.textContent = itemName(item, currentLang);

          const price = document.createElement('span');
          price.className = 'item-price';
          price.textContent = item.price.toLocaleString('sr') + ' din';

          card.appendChild(name);
          card.appendChild(price);
          itemsGrid.appendChild(card);
        });

        group.appendChild(itemsGrid);
        grid.appendChild(group);
      });
    }

    function renderAll() {
      renderCategories();
      renderMenu();
    }

    // Language switcher
    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentLang = btn.dataset.lang;
        document.documentElement.lang = currentLang === 'sr' ? 'sr' : currentLang === 'en' ? 'en' : 'ru';
        renderAll();
      });
    });

    renderAll();
  </script>
</body>
</html>
