    const CATS = [...new Set(MENU.map(i => i.cat))];
    let currentLang = 'ru';
    let currentCat  = 'all';

    function catLabel(cat) { return LANGS[currentLang].categories[cat] || cat; }
    function catSub(cat)   { return LANGS[currentLang].catsSub[cat] || ''; }

    function formatPrice(p) {
      return p.toLocaleString('de') + '<span class="currency">din</span>';
    }

    function renderCategories() {
      const el = document.getElementById('categories');
      el.innerHTML = '';
      const all = makeTab(LANGS[currentLang].all, 'all');
      el.appendChild(all);
      CATS.forEach(cat => el.appendChild(makeTab(catLabel(cat), cat)));
    }

    function makeTab(label, key) {
      const btn = document.createElement('button');
      btn.className = 'cat-tab' + (currentCat === key ? ' active' : '');
      btn.textContent = label;
      btn.addEventListener('click', () => {
        currentCat = key;
        renderAll();
        // scroll active tab into view
        btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
      });
      return btn;
    }

    function renderContent() {
      const el = document.getElementById('content');
      el.innerHTML = '';
      const catsToShow = currentCat === 'all' ? CATS : [currentCat];
      const [primary, secondary] = NAME_FIELDS[currentLang];

      catsToShow.forEach(cat => {
        const items = MENU.filter(i => i.cat === cat);
        if (!items.length) return;

        const block = document.createElement('div');
        block.className = 'section-block';

        const h = document.createElement('h2');
        h.className = 'section-heading';
        h.textContent = catLabel(cat);
        block.appendChild(h);

        const sub = document.createElement('p');
        sub.className = 'section-heading-sub';
        sub.textContent = catSub(cat);
        block.appendChild(sub);

        const list = document.createElement('div');
        list.className = 'items-list';

        items.forEach(item => {
          const row = document.createElement('div');
          row.className = 'item-row';

          const info = document.createElement('div');
          info.className = 'item-info';

          const main = document.createElement('div');
          main.className = 'item-main';
          main.textContent = item[primary] || item.ru;

          const sec = document.createElement('div');
          sec.className = 'item-sub';
          sec.textContent = item[secondary] || '';

          info.appendChild(main);
          if (sec.textContent) info.appendChild(sec);

          const price = document.createElement('div');
          price.className = 'item-price';
          price.innerHTML = formatPrice(item.price);

          row.appendChild(info);
          row.appendChild(price);
          list.appendChild(row);
        });

        block.appendChild(list);
        el.appendChild(block);
      });
    }

    function renderAll() {
      renderCategories();
      renderContent();
    }

    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentLang = btn.dataset.lang;
        document.documentElement.lang = { ru: 'ru', en: 'en', sr: 'sr' }[currentLang];
        renderAll();
      });
    });

    renderAll();
  </script>
