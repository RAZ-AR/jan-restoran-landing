<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ĐAN Restoran — Popust 10%</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css?v=2">
    <style>
        .discount-card {
            background: linear-gradient(135deg,
                rgba(255,255,255,0.18) 0%,
                rgba(255,255,255,0.07) 50%,
                rgba(255,255,255,0.15) 100%
            );
            backdrop-filter: blur(24px) saturate(1.4);
            -webkit-backdrop-filter: blur(24px) saturate(1.4);
            border: 1.5px solid rgba(255,255,255,0.35);
            border-radius: 28px;
            padding: 2.5rem 3rem;
            text-align: center;
            max-width: 340px;
            width: 90%;
            margin: 0 auto;
            box-shadow: 0 8px 40px rgba(0,0,0,0.3),
                        0 1px 4px rgba(255,255,255,0.12) inset;
            animation: welcomeAppear 0.9s ease both;
        }
        .discount-greeting {
            font-family: 'Roboto', sans-serif;
            font-size: 1rem;
            color: rgba(255,255,255,0.75);
            letter-spacing: 0.04em;
            margin: 0 0 0.5rem;
        }
        .discount-badge {
            font-family: 'SFT Schrifted Serif', serif;
            font-size: clamp(4.5rem, 20vw, 7.5rem);
            font-weight: 700;
            font-style: italic;
            color: rgba(255,255,255,0.97);
            letter-spacing: 0.04em;
            line-height: 1;
            text-shadow:
                0 0 30px rgba(255,255,255,0.45),
                0 0 70px rgba(255,215,0,0.3),
                2px 2px 12px rgba(0,0,0,0.8);
            margin: 0.2rem 0;
        }
        .discount-label {
            font-family: 'SFT Schrifted Serif', serif;
            font-style: italic;
            font-size: 1.3rem;
            color: rgba(255,255,255,0.88);
            margin: 0.3rem 0 0;
        }
        .discount-note {
            font-family: 'Roboto', sans-serif;
            font-size: 0.82rem;
            color: rgba(255,255,255,0.5);
            margin-top: 1.2rem;
            letter-spacing: 0.06em;
        }
        .main-content {
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div class="dance-background" style="background: url('discount-bg.jpg') center center / cover no-repeat fixed;">
        <div class="dance-overlay"></div>
    </div>

    <div class="container">
        <header class="logo-container">
            <img src="Logo white.svg" alt="ĐAN Restoran Logo" class="logo">
        </header>

        <main class="main-content">
            <div class="discount-card">
                <p class="discount-greeting">Poštovani goste / Уважаемый гость</p>
                <div class="discount-badge">10%</div>
                <p class="discount-label">popust / скидка</p>
            </div>
        </main>

        <footer class="contact-section">
            <div class="contact-info">
                <p class="address">ĐAN Restoran</p>
                <p class="address">Prizrenska 15, Stari Grad, Beograd</p>
                <p class="phone">Phone: <a href="tel:+38163446454">+381 63 44 64 54</a></p>
            </div>
            <div class="menu-btn-row">
                <a href="index.html" class="menu-glass-btn">← Početna</a>
            </div>
        </footer>
    </div>
</body>
</html>
